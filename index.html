<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho ♥</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <!-- TELA INICIAL -->
    <section id="inicio">

        <div class="inicio-card">

            <div class="coracao-grande">♥</div>

            <h1>Nosso Cantinho</h1>

            <p>Um lugar feito com carinho</p>

            <button onclick="entrar()">
                Entrar ♥
            </button>

        </div>

    </section>


    <!-- SITE PRINCIPAL -->
    <div id="site">

        <header>

            <div class="coracao-grande">♥</div>

            <h1>Um Cantinho Especial</h1>

            <p>Feito com carinho</p>

        </header>


        <main>

            <section class="card">

                <h2>♥ Uma mensagem</h2>

                <p>
                    Existem pessoas que tornam nossos dias
                    mais especiais simplesmente por estarem neles.
                </p>

            </section>


            <section class="card">

                <h2>♥ Uma surpresa</h2>

                <button onclick="mostrarMensagem()">
                    Clique aqui
                </button>

                <p id="mensagem"></p>

            </section>

        </main>


        <footer>
            Feito com ♥
        </footer>

    </div>


    <script src="Script.js"></script>

</body>

</html>
